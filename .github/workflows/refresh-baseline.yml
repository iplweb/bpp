name: Refresh baseline pg_dump

# Regenerates baseline-sql/baseline.sql + baseline.meta.json after
# any push to dev that touches a migration file. The workflow uses the
# canonical Make target, which loads the existing baseline, applies only
# pending migrations and spins up an isolated Postgres via testcontainers
# (iplweb/bpp_dbserver:psql-16.13).
#
# Manual trigger via the Actions tab is also enabled.

on:
  push:
    branches:
      - dev
    paths:
      - 'src/**/migrations/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Pin jak w tests.yml (job `lock-check`). Tu szczegolnie wazny:
          # baseline commitowany do repo nie moze zalezec od tego, ktora
          # wersja uv akurat byla "latest" w dniu przebiegu.
          version: "0.11.29"

      - name: Install system build deps
        # uv sync builds several wheels from source (pycairo via
        # svglib/xhtml2pdf, psycopg2, python-ldap, cryptography) that need
        # native headers. Reuse docker/bpp_base/build.txt so the package
        # list stays in sync with the runtime/test images and tests.yml.
        run: |
          sudo apt-get update
          xargs -a docker/bpp_base/build.txt sudo apt-get install -y

      - name: Install Python deps (with baseline-rebuild extra)
        run: uv sync --frozen --no-install-project --extra baseline-rebuild

      - name: Pre-pull dbserver image
        run: docker pull iplweb/bpp_dbserver:psql-16.13 || true

      - name: Update baseline in place
        # The Make target also repairs pg_dump's empty search_path. Calling
        # the management command directly would omit that required post-step.
        run: make baseline-update

      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- baseline-sql/baseline.sql baseline-sql/baseline.meta.json; then
            echo "No baseline changes to commit"
            exit 0
          fi
          git add baseline-sql/baseline.sql baseline-sql/baseline.meta.json
          git commit -m "chore(baseline): refresh pg_dump after migration change [skip ci]"
          git push origin HEAD:dev
