{# Pole „Powód usunięcia” jako wiersz formularza Grappelli (jak includes/fieldset.html). #}
{# Parametr: pomoc — tekst pomocy pod polem. #}
<div class="form-row grp-row grp-cells-1 powod">
  <div class="field-box l-2c-fluid l-d-4">
    <div class="c-1"><label for="id_powod">Powód usunięcia</label></div>
    <div class="c-2">
      <textarea name="powod" id="id_powod" rows="3" cols="40" class="vLargeTextField"></textarea>
      <p class="grp-help">{{ pomoc }}</p>
    </div>
  </div>
</div>
