{% extends "admin/change_form.html" %}

{% block extrahead %}
    {{ block.super }}
    <script>
    document.addEventListener('click', function(e) {
        var link = e.target.closest('[data-action="open-preview-window"]');
        if (!link) {
            return;
        }
        e.preventDefault();
        var contentElement = document.querySelector(link.dataset.contentSelector);
        var csrfElement = document.querySelector(
            'input[name="csrfmiddlewaretoken"]'
        );
        if (!contentElement || !csrfElement) {
            return;
        }
        var form = document.createElement('form');
        form.method = 'post';
        form.action = link.dataset.previewUrl;
        form.target = 'preview';
        [
            ['csrfmiddlewaretoken', csrfElement.value],
            ['template', contentElement.value]
        ].forEach(function(pair) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = pair[0];
            input.value = pair[1];
            form.appendChild(input);
        });
        document.body.appendChild(form);
        window.open('', 'preview', 'width=600,height=400');
        form.submit();
        document.body.removeChild(form);
    });
    </script>
{% endblock %}

{% block object-tools-items %}
    {% if original.name == "opis_bibliograficzny.html" %}
        <li>
            <a href="#" data-action="open-preview-window"
               data-preview-url="../../preview/"
               data-content-selector="#id_content">Szybki podgląd</a></li>
    {% endif %}
    {{ block.super }}
{% endblock %}
