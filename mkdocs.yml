site_name: Bibliografia Publikacji Pracowników
site_description: Dokumentacja systemu BPP (Bibliografia Publikacji Pracowników)
site_url: https://iplweb.github.io/bpp/
repo_url: https://github.com/iplweb/bpp
repo_name: iplweb/bpp
edit_uri: edit/dev/docs/
copyright: Copyright &copy; 2005-2026 iplweb.pl — Michał Pasternak

docs_dir: docs

theme:
  name: material
  language: pl
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Tryb jasny
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
  - autorefs
  - glightbox
  # Wlasne ograniczniki zamiast domyslnych `{% %}`. Domyslne sa DOKLADNIE
  # te same, ktorych uzywa Django, a dokumentacja BPP cytuje szablony Django
  # w kolko (np. `{% include "long_running/operation_details.html" %}`
  # w planach liveops). Wtyczka brala taki cytat za polecenie i probowala
  # wciagnac plik, ktorego w `docs/` nie ma -- build padal z BuildError,
  # a autor dokumentu nie mial powodu podejrzewac, ze opisanie szablonu
  # Django psuje strone. Rozdzielenie skladni likwiduje cala te klase
  # bledow; escape'owanie pojedynczych wystapien tylko odsuwa nastepne.
  - include-markdown:
      opening_tag: "{!"
      closing_tag: "!}"

exclude_docs: |
  superpowers/
  requirements.txt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_javascript:
  - assets/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

